[project]
name = "tictalk-backend"
version = "0.1.0"
description = "Cartesia + Claude voice chat backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cartesia-line>=0.2.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
